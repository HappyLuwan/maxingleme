﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>骂醒了么 · 一句话金句</title>
    <style>
        /* 移除 Google Fonts 外链，改用系统字体避免容器网络阻塞 */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 750px;
            height: 1000px;
            font-family: 'Songti SC', 'STSong', 'SimSun', 'PingFang SC', serif;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 750px;
            height: 1000px;
            padding: 80px 70px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;

            background:
                radial-gradient(ellipse at 15% 10%, rgba(255, 71, 87, 0.35) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 90%, rgba(255, 140, 58, 0.25) 0%, transparent 55%),
                linear-gradient(180deg, #0a0a0a 0%, #1a0a0a 100%);
            color: #fff;
        }

        /* 网格背景（极细，营造质感） */
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        /* 顶部风格标签 */
        .top-tag-wrap {
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .top-tag {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 12px 32px;
            border-radius: 100px;
            background: linear-gradient(135deg, #ff4757 0%, #ff8c3a 100%);
            box-shadow: 0 8px 32px rgba(255, 71, 87, 0.5);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        .top-tag-emoji {
            font-size: 28px;
        }

        /* 主金句区 */
        .quote-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 2;
            padding: 20px 0;
        }

        .accent-bar {
            width: 80px;
            height: 6px;
            background: linear-gradient(90deg, #ff4757, #ff8c3a);
            border-radius: 4px;
            margin-bottom: 60px;
            box-shadow: 0 0 24px rgba(255, 71, 87, 0.6);
        }

        /* 金句主体：字号根据内容长度自适应 */
        .quote {
            font-family: 'Songti SC', 'STSong', 'SimSun', serif;
            font-weight: 900;
            line-height: 1.55;
            letter-spacing: 6px;
            color: #fff;
            text-shadow: 0 4px 24px rgba(255, 71, 87, 0.3);
            max-width: 600px;
            /* 默认（10-15字）：巨型 */
            font-size: 76px;
        }

        /* 16-22 字：稍收 */
        .quote.medium {
            font-size: 60px;
            letter-spacing: 4px;
        }

        /* 23+ 字兜底：还是要看得清 */
        .quote.long {
            font-size: 50px;
            letter-spacing: 3px;
            line-height: 1.6;
        }

        /* 引号装饰 */
        .quote-mark {
            font-family: 'Georgia', serif;
            font-size: 200px;
            font-weight: 900;
            color: rgba(255, 71, 87, 0.15);
            line-height: 0.6;
            margin-bottom: 20px;
            user-select: none;
        }

        .quote-mark-end {
            font-family: 'Georgia', serif;
            font-size: 200px;
            font-weight: 900;
            color: rgba(255, 71, 87, 0.15);
            line-height: 0.5;
            margin-top: 30px;
            transform: rotate(180deg);
            user-select: none;
        }

        /* 底部品牌区 */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 30px;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 2;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .brand-name {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ff4757 0%, #ff8c3a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-slogan {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        .qrcode {
            width: 90px;
            height: 90px;
            background: #fff;
            border-radius: 10px;
            padding: 6px;
            box-shadow: 0 4px 20px rgba(255, 71, 87, 0.3);
        }

        .qrcode-placeholder {
            width: 100%;
            height: 100%;
            background:
                repeating-linear-gradient(90deg, #0a0a0a 0 5px, transparent 5px 10px),
                repeating-linear-gradient(0deg, #0a0a0a 0 5px, transparent 5px 10px);
            border-radius: 6px;
        }

        /* 角标装饰 */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid #ff4757;
            z-index: 3;
        }
        .corner.tl { top: 30px; left: 30px; border-right: none; border-bottom: none; }
        .corner.tr { top: 30px; right: 30px; border-left: none; border-bottom: none; }
        .corner.bl { bottom: 30px; left: 30px; border-right: none; border-top: none; }
        .corner.br { bottom: 30px; right: 30px; border-left: none; border-top: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="top-tag-wrap">
        <div class="top-tag">
            <span class="top-tag-emoji">{{ styleEmoji }}</span>
            <span>{{ styleName }}</span>
        </div>
    </div>

    <div class="quote-area">
        <div class="quote-mark">"</div>
        <div class="quote {% if contentLength > 22 %}long{% elif contentLength > 15 %}medium{% endif %}">{{ content }}</div>
        <div class="quote-mark-end">"</div>
    </div>

    <div class="footer">
        <div class="brand">
            <div class="brand-name">🔥 骂醒了么</div>
            <div class="brand-slogan">扫码领取你的骂醒</div>
        </div>
        <div class="qrcode">
            {% if qrcodeUrl %}
            <img src="{{ qrcodeUrl }}" alt="qr" style="width:100%;height:100%;border-radius:6px;"/>
            {% else %}
            <div class="qrcode-placeholder"></div>
            {% endif %}
        </div>
    </div>
</div>
</body>
</html>
