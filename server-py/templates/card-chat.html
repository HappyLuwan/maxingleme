<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>骂醒了么 · 对话截屏</title>
    <style>
        /* 系统字体，遵守项目 CONTEXT 5.1：禁止 Google Fonts 外链 */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 750px;
            height: 1000px;
            font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
            -webkit-font-smoothing: antialiased;
            background: #000;
        }

        .card {
            width: 750px;
            height: 1000px;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ============ iOS 状态栏 ============ */
        .status-bar {
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px 0 44px;
            font-family: -apple-system, 'Helvetica Neue', sans-serif;
        }

        .status-time {
            font-size: 28px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 1px;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            color: #fff;
        }

        .signal-dots {
            display: inline-flex;
            gap: 3px;
            align-items: flex-end;
        }
        .signal-dots span {
            width: 5px;
            background: #fff;
            border-radius: 1px;
        }
        .signal-dots span:nth-child(1) { height: 6px; }
        .signal-dots span:nth-child(2) { height: 10px; }
        .signal-dots span:nth-child(3) { height: 14px; }
        .signal-dots span:nth-child(4) { height: 18px; }

        .battery {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 22px;
            font-weight: 500;
        }
        .battery-icon {
            width: 34px;
            height: 16px;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-radius: 4px;
            padding: 1.5px;
            position: relative;
        }
        .battery-icon::after {
            content: '';
            position: absolute;
            right: -4px;
            top: 4px;
            width: 2px;
            height: 6px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 0 1px 1px 0;
        }
        .battery-icon::before {
            content: '';
            display: block;
            width: 78%;
            height: 100%;
            background: #fff;
            border-radius: 1px;
        }

        /* ============ 顶部对话标题 ============ */
        .nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0 24px;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
        }

        .nav-avatar {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1c1c1e 0%, #2c2c2e 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            margin-bottom: 8px;
        }

        .nav-title {
            font-size: 26px;
            font-weight: 500;
            color: #fff;
            letter-spacing: 1px;
        }

        .nav-sub {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
            letter-spacing: 2px;
        }

        /* 右上返回箭头（绝对定位） */
        .nav-back {
            position: absolute;
            left: 30px;
            top: 78px;
            font-size: 44px;
            color: #0a84ff;
            font-weight: 300;
            line-height: 1;
        }

        /* ============ 消息区 ============ */
        .messages {
            flex: 1;
            padding: 30px 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow: hidden;
        }

        .time-stamp {
            text-align: center;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.4);
            padding: 4px 0 8px;
            letter-spacing: 2px;
        }
        .time-stamp b {
            color: rgba(255, 255, 255, 0.75);
            font-weight: 600;
            margin-left: 8px;
        }

        .msg-row {
            display: flex;
            width: 100%;
        }
        .msg-row.right { justify-content: flex-end; }
        .msg-row.left { justify-content: flex-start; }

        .bubble {
            max-width: 540px;
            padding: 20px 26px;
            font-size: 30px;
            line-height: 1.5;
            border-radius: 26px;
            word-break: break-word;
            position: relative;
        }

        /* 用户气泡：iOS 蓝 */
        .bubble.me {
            background: #0a84ff;
            color: #fff;
            border-bottom-right-radius: 8px;
        }

        /* AI 气泡：深灰 */
        .bubble.ai {
            background: #2c2c2e;
            color: #f5f5f7;
            border-bottom-left-radius: 8px;
        }

        .bubble.long { font-size: 26px; }
        .bubble.longer { font-size: 22px; }

        /* AI 关键金句用略强调的字重（非红色，保持克制） */
        .bubble.ai b {
            color: #fff;
            font-weight: 700;
        }

        /* ============ 底部输入栏（伪装） ============ */
        .input-bar {
            border-top: 0.5px solid rgba(255, 255, 255, 0.08);
            padding: 20px 30px 30px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .input-plus {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #1c1c1e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 300;
            flex-shrink: 0;
        }

        .input-box {
            flex: 1;
            height: 44px;
            background: #1c1c1e;
            border-radius: 22px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 22px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 2px;
        }

        .input-serial {
            font-family: 'Georgia', serif;
            font-size: 20px;
            color: rgba(10, 132, 255, 0.75);
            letter-spacing: 2px;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="card">
    <!-- iOS 状态栏 -->
    <div class="status-bar">
        <div class="status-time">{{ timeStr }}</div>
        <div class="status-right">
            <span class="signal-dots"><span></span><span></span><span></span><span></span></span>
            <span style="font-size:22px;letter-spacing:0.5px;">5G</span>
            <span class="battery"><span class="battery-icon"></span></span>
        </div>
    </div>

    <!-- 对话标题 -->
    <div class="nav">
        <div class="nav-back">‹</div>
        <div class="nav-avatar">{{ styleEmoji }}</div>
        <div class="nav-title">{{ styleName }}</div>
                <div class="nav-sub">在线 · 正在输入…</div>
    </div>

    <!-- 消息 -->
    <div class="messages">
        <div class="time-stamp">{{ dateStr }} <b>{{ timeStr }}</b></div>

        <div class="msg-row right">
            <div class="bubble me {% if userInputLength > 60 %}longer{% elif userInputLength > 30 %}long{% endif %}">{{ userInput }}</div>
        </div>

        <div class="msg-row left">
            <div class="bubble ai {% if contentLength > 100 %}longer{% elif contentLength > 60 %}long{% endif %}">{{ content }}</div>
        </div>
    </div>

    <!-- 底部输入栏（伪装完整聊天 UI） -->
    <div class="input-bar">
        <div class="input-plus">+</div>
        <div class="input-box">
            <span>iMessage</span>
            <span class="input-serial">#{{ serialNo }}</span>
        </div>
    </div>
</div>
</body>
</html>
