<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>骂醒了么 · 聊天卡片</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 750px;
            height: 1000px;
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            -webkit-font-smoothing: antialiased;
            background: #ededed;
        }

        .card {
            width: 750px;
            height: 1000px;
            background: #ededed;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .nav {
            height: 90px;
            background: #f7f7f7;
            border-bottom: 1px solid #d8d8d8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            position: relative;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 28px;
            color: #222;
        }

        .nav-back {
            font-size: 36px;
            color: #222;
            font-weight: 300;
        }

        .nav-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            font-weight: 500;
            color: #000;
        }

        .nav-right {
            font-size: 40px;
            color: #222;
            letter-spacing: 3px;
        }

        .messages {
            flex: 1;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .time-stamp {
            text-align: center;
            font-size: 22px;
            color: #999;
            padding: 6px 16px;
            align-self: center;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 6px;
        }

        .msg-row {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .msg-row.right {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 76px;
            height: 76px;
            border-radius: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: 900;
            color: #fff;
        }

        .avatar.ai {
            background: linear-gradient(135deg, #ff6b3d 0%, #ff4757 100%);
        }

        .avatar.user {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
        }

        .bubble-wrap {
            max-width: 500px;
            display: flex;
            flex-direction: column;
        }

        .msg-row.right .bubble-wrap {
            align-items: flex-end;
        }

        .name {
            font-size: 22px;
            color: #888;
            margin-bottom: 6px;
            padding: 0 4px;
        }

        .bubble {
            padding: 22px 26px;
            border-radius: 14px;
            font-size: 30px;
            line-height: 1.55;
            color: #222;
            position: relative;
            word-break: break-word;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .bubble.ai {
            background: #ffffff;
            border-top-left-radius: 4px;
        }

        .bubble.ai::before {
            content: '';
            position: absolute;
            left: -10px;
            top: 12px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 8px 12px 8px 0;
            border-color: transparent #ffffff transparent transparent;
        }

        .bubble.user {
            background: #95ec69;
            border-top-right-radius: 4px;
        }

        .bubble.user::before {
            content: '';
            position: absolute;
            right: -10px;
            top: 12px;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 8px 0 8px 12px;
            border-color: transparent transparent transparent #95ec69;
        }

        .bubble.long { font-size: 26px; }
        .bubble.longer { font-size: 22px; }

        .footer {
            padding: 20px 30px 30px;
            background: linear-gradient(180deg, #ededed 0%, #ffffff 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 900;
            color: #ff4757;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-slogan {
            font-size: 20px;
            color: #999;
        }

        .qrcode {
            width: 120px;
            height: 120px;
            background: #fff;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }

        .qrcode-placeholder {
            width: 100%;
            height: 100%;
            background:
                repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 10px),
                repeating-linear-gradient(0deg, #000 0 5px, transparent 5px 10px);
            border-radius: 6px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="nav">
        <div class="nav-left">
            <span class="nav-back">‹</span>
            <span>19</span>
        </div>
        <div class="nav-title">骂醒了么 AI</div>
        <div class="nav-right">···</div>
    </div>

    <div class="messages">
        <div class="time-stamp">{{ dateStr }}</div>

        <div class="msg-row right">
            <div class="avatar user">我</div>
            <div class="bubble-wrap">
                <div class="bubble user {% if userInputLength > 60 %}longer{% elif userInputLength > 30 %}long{% endif %}">{{ userInput }}</div>
            </div>
        </div>

        <div class="msg-row">
            <div class="avatar ai">🔥</div>
            <div class="bubble-wrap">
                <div class="name">{{ styleEmoji }} 骂醒 AI · {{ styleName }}</div>
                <div class="bubble ai {% if contentLength > 100 %}longer{% elif contentLength > 60 %}long{% endif %}">{{ content }}</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="brand">
            <div class="brand-name">🔥 骂醒了么</div>
            <div class="brand-slogan">你今天，骂醒了么？→ 微信搜"骂醒了么"</div>
        </div>
        <div class="qrcode">
            {% if qrcodeUrl %}
            <img src="{{ qrcodeUrl }}" alt="qr" style="width:100%;height:100%;border-radius:6px;"/>
            {% else %}
            <div class="qrcode-placeholder"></div>
            {% endif %}
        </div>
    </div>
</div>
</body>
</html>
