<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>骂醒了么 · 醒神药方</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 750px;
            height: 1000px;
            font-family: 'Songti SC', 'STSong', 'SimSun', serif;
            -webkit-font-smoothing: antialiased;
            background: #f4efe4;
        }

        .card {
            width: 750px;
            height: 1000px;
            padding: 60px 62px 50px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            background:
                /* 一层极轻的纸纹（径向），有质感但不喧宾 */
                radial-gradient(circle at 20% 30%, rgba(180, 150, 100, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(180, 150, 100, 0.04) 0%, transparent 40%),
                #f6f1e4;
            color: #2a2a2a;
        }

        /* ==== 顶部诊所抬头 ==== */
        .clinic-head {
            border-bottom: 2px solid #2a2a2a;
            padding-bottom: 20px;
            margin-bottom: 26px;
        }

        .clinic-name-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .clinic-name {
            font-family: 'STKaiti', 'KaiTi', 'Songti SC', serif;
            font-size: 40px;
            font-weight: 700;
            letter-spacing: 8px;
            color: #2a2a2a;
        }

        .clinic-en {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 20px;
            color: #7a6a4a;
            letter-spacing: 3px;
            font-style: italic;
        }

        .clinic-sub {
            font-size: 20px;
            color: #6a5a3a;
            letter-spacing: 2px;
        }

        /* ==== 处方元数据 ==== */
        .rx-meta {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            color: #5a4a2a;
            letter-spacing: 1.5px;
            margin-bottom: 28px;
        }

        .rx-meta-item strong {
            color: #2a2a2a;
            font-weight: 700;
            margin-left: 6px;
        }

        /* ==== Rx 符号 + 主诉 ==== */
        .rx-symbol-row {
            display: flex;
            gap: 20px;
            margin-bottom: 22px;
            align-items: flex-start;
        }

        .rx-symbol {
            font-family: 'Times New Roman', Georgia, serif;
            font-size: 90px;
            font-weight: 700;
            color: #c8302a;
            line-height: 0.85;
            font-style: italic;
        }

        .rx-symbol-info {
            flex: 1;
            padding-top: 12px;
        }

        .rx-symbol-info .l1 {
            font-size: 22px;
            color: #5a4a2a;
            letter-spacing: 3px;
            margin-bottom: 6px;
        }

        .rx-symbol-info .l2 {
            font-size: 24px;
            color: #2a2a2a;
            font-weight: 700;
            letter-spacing: 2px;
        }

        /* ==== 处方主体 ==== */
        .rx-body {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .rx-section {
            margin-bottom: 20px;
        }

        .rx-section-label {
            display: inline-block;
            padding: 3px 12px;
            background: #2a2a2a;
            color: #f6f1e4;
            font-size: 20px;
            letter-spacing: 3px;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .rx-section-body {
            font-size: 24px;
            color: #2a2a2a;
            line-height: 1.65;
            letter-spacing: 1px;
            padding-left: 6px;
        }

        /* 主处方（金句） */
        .rx-main {
            flex: 1;
            padding: 26px 0 20px;
        }

        .rx-main-label {
            font-size: 22px;
            color: #c8302a;
            letter-spacing: 6px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .rx-main-text {
            font-family: 'STKaiti', 'KaiTi', 'Songti SC', serif;
            font-size: 44px;
            font-weight: 700;
            color: #2a2a2a;
            line-height: 1.6;
            letter-spacing: 2px;
        }

        .rx-main-text.medium { font-size: 36px; line-height: 1.65; }
        .rx-main-text.long { font-size: 30px; line-height: 1.7; }

        /* ==== 底部签名区 ==== */
        .rx-footer {
            border-top: 1px dashed rgba(42, 42, 42, 0.3);
            padding-top: 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .rx-sign {
            font-size: 20px;
            color: #5a4a2a;
            letter-spacing: 2px;
            line-height: 1.6;
        }

        .rx-sign strong {
            font-family: 'STKaiti', 'KaiTi', serif;
            font-size: 24px;
            color: #c8302a;
            margin-left: 6px;
        }

        .rx-stamp {
            width: 100px;
            height: 100px;
            border: 3px solid #c8302a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'STKaiti', serif;
            font-size: 22px;
            font-weight: 700;
            color: #c8302a;
            letter-spacing: 2px;
            transform: rotate(-8deg);
            opacity: 0.9;
            text-align: center;
            line-height: 1.2;
        }

        .rx-note {
            text-align: center;
            font-size: 18px;
            color: rgba(42, 42, 42, 0.4);
            letter-spacing: 3px;
            margin-top: 14px;
            font-family: 'PingFang SC', sans-serif;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="clinic-head">
        <div class="clinic-name-row">
            <div class="clinic-name">醒神工作室</div>
            <div class="clinic-en">Clarity Studio</div>
        </div>
        <div class="clinic-sub">— 情绪重启 · 认知矫正 · 今日醒神笔记 —</div>
    </div>

    <div class="rx-meta">
        <div class="rx-meta-item">笔记编号：<strong>{{ rxNo }}</strong></div>
        <div class="rx-meta-item">日期：<strong>{{ dateStr }}</strong></div>
    </div>

    <div class="rx-symbol-row">
        <div class="rx-symbol">℞</div>
        <div class="rx-symbol-info">
            <div class="l1">今日情绪 · TODAY'S MOOD</div>
            <div class="l2">自我感动过量，需一记金句以醒神</div>
        </div>
    </div>

    <div class="rx-body">
        <div class="rx-main">
            <div class="rx-main-label">◆ 金句 · THE QUOTE</div>
            <div class="rx-main-text {% if contentLength > 35 %}long{% elif contentLength > 20 %}medium{% endif %}">{{ content }}</div>
        </div>

        <div class="rx-section">
            <span class="rx-section-label">使用建议</span>
            <div class="rx-section-body">默念三遍，深呼吸五次，必要时分享给需要醒神的朋友。</div>
        </div>
    </div>

    <div class="rx-footer">
        <div class="rx-sign">
            签署：<strong>AI · {{ styleName }}</strong><br>
            {{ ganzhiYear }}年 · {{ dateStr }} · {{ timeStr }}
        </div>
        <div class="rx-stamp">醒神<br>专用</div>
    </div>

    <div class="rx-note">* 本笔记仅供娱乐，不构成任何专业建议</div>
</div>
</body>
</html>
