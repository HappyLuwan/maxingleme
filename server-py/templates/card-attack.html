<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>骂醒了么 · 暴击卡片</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 750px;
            height: 1000px;
            font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            -webkit-font-smoothing: antialiased;
            background: #0a0a0a;
        }

        .card {
            width: 750px;
            height: 1000px;
            padding: 60px 55px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;

            /* 主背景：黑红渐变 + 噪点 */
            background:
                radial-gradient(ellipse at top left, rgba(255, 88, 88, 0.28) 0%, transparent 55%),
                radial-gradient(ellipse at bottom right, rgba(255, 152, 66, 0.22) 0%, transparent 60%),
                linear-gradient(135deg, #1a0e0e 0%, #0a0a0a 60%, #100808 100%);
            color: #ffffff;
        }

        .tag-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 100px;
            background: linear-gradient(90deg, #ff4757 0%, #ff6b3d 100%);
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4);
        }

        .date {
            font-size: 22px;
            color: rgba(255, 255, 255, 0.35);
            font-weight: 400;
            letter-spacing: 2px;
        }

        .headline {
            font-family: 'Noto Serif SC', serif;
            font-size: 42px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 25px;
            letter-spacing: 4px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .headline::before {
            content: '';
            width: 8px;
            height: 42px;
            background: linear-gradient(180deg, #ff4757 0%, #ff8c3a 100%);
            border-radius: 4px;
        }

        .content-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 20px 0;
        }

        .quote {
            font-family: 'Noto Serif SC', serif;
            font-size: 52px;
            font-weight: 700;
            line-height: 1.55;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 2px 20px rgba(255, 71, 87, 0.3);
            position: relative;
        }

        .quote.long {
            font-size: 40px;
            line-height: 1.6;
        }

        .quote.longer {
            font-size: 34px;
            line-height: 1.7;
        }

        .quote::before {
            content: '"';
            position: absolute;
            left: -30px;
            top: -40px;
            font-size: 120px;
            color: rgba(255, 71, 87, 0.35);
            font-family: 'Georgia', serif;
            line-height: 1;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.25) 50%, transparent 100%);
            margin: 30px 0 25px;
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-name .fire {
            font-size: 30px;
        }

        .brand-slogan {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }

        .qrcode {
            width: 140px;
            height: 140px;
            border-radius: 16px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .qrcode-placeholder {
            width: 100%;
            height: 100%;
            background:
                repeating-linear-gradient(90deg, #000 0 6px, transparent 6px 12px),
                repeating-linear-gradient(0deg, #000 0 6px, transparent 6px 12px);
            border-radius: 8px;
            position: relative;
        }

        .qrcode-placeholder::after {
            content: '扫码骂我';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
        }

        .decoration {
            position: absolute;
            font-size: 240px;
            font-weight: 900;
            color: rgba(255, 71, 87, 0.06);
            font-family: 'Noto Serif SC', serif;
            pointer-events: none;
            user-select: none;
        }

        .decoration-1 {
            top: -40px;
            right: -20px;
        }

        .decoration-2 {
            bottom: -80px;
            left: -30px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="decoration decoration-1">骂</div>
    <div class="decoration decoration-2">醒</div>

    <div class="tag-row">
        <span class="tag">💥 {{ styleEmoji }} {{ styleName }}·暴击版</span>
        <span class="date">{{ dateStr }}</span>
    </div>

    <div class="headline">今日暴击语录</div>

    <div class="content-wrap">
        <div class="quote {% if contentLength > 100 %}longer{% elif contentLength > 60 %}long{% endif %}">{{ content }}</div>
    </div>

    <div class="divider"></div>

    <div class="footer">
        <div class="brand">
            <div class="brand-name">
                <span class="fire">🔥</span>
                <span>骂醒了么</span>
            </div>
            <div class="brand-slogan">你今天，骂醒了么？</div>
        </div>
        <div class="qrcode">
            {% if qrcodeUrl %}
            <img src="{{ qrcodeUrl }}" alt="qr" style="width:100%;height:100%;border-radius:8px;"/>
            {% else %}
            <div class="qrcode-placeholder"></div>
            {% endif %}
        </div>
    </div>
</div>
</body>
</html>
