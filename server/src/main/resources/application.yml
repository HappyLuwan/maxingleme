server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: maxingleme-server
  profiles:
    # 默认使用 local 环境（H2 内存数据库，无需外部依赖）
    # 生产环境切换为 prod（application-prod.yml）
    active: local
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# AI 大模型配置（可通过后台切换 active provider）
ai:
  # 默认启用的 provider（可被数据库配置覆盖）
  default-provider: deepseek
  # 兜底 provider（当默认失败时自动切换）
  fallback-provider: hunyuan
  # 请求超时时间（毫秒）
  timeout: 30000
  # 各 provider 配置
  providers:
    deepseek:
      enabled: true
      # 生产：改用官方地址 https://api.deepseek.com/v1/chat/completions
      api-url: ${DEEPSEEK_API_URL:http://v2.open.venus.oa.com/llmproxy}
      api-key: ${DEEPSEEK_API_KEY:sk-your-deepseek-key-here}
      model: ${DEEPSEEK_MODEL:deepseek-v4-pro-external}
      temperature: 1.0
      max-tokens: 500
    hunyuan:
      enabled: true
      api-url: https://api.hunyuan.cloud.tencent.com/v1/chat/completions
      api-key: ${HUNYUAN_API_KEY:sk-your-hunyuan-key-here}
      model: hunyuan-lite
      temperature: 1.0
      max-tokens: 500
    doubao:
      enabled: false
      api-url: https://ark.cn-beijing.volces.com/api/v3/chat/completions
      api-key: ${DOUBAO_API_KEY:your-doubao-key-here}
      model: doubao-lite-4k
      temperature: 1.0
      max-tokens: 500
    qwen:
      enabled: false
      api-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      api-key: ${QWEN_API_KEY:sk-your-qwen-key-here}
      model: qwen-turbo
      temperature: 1.0
      max-tokens: 500

# 微信小程序配置
wechat:
  miniapp:
    app-id: ${WX_APPID:your-wx-appid}
    app-secret: ${WX_SECRET:your-wx-secret}
    # 内容安全 API
    content-security:
      enabled: true

# 卡片生成配置
card:
  # 卡片图片保存目录（本地临时目录，最终会上传到云存储）
  output-dir: ${CARD_OUTPUT_DIR:/tmp/mxlm-cards}
  # 卡片尺寸（宽 x 高）
  width: 750
  height: 1000
  # 是否启用 Playwright（本地首次运行会自动下载浏览器）
  playwright-enabled: true

# 管理后台配置（简易鉴权）
admin:
  # 后台访问 Token（生产环境务必修改）
  token: ${ADMIN_TOKEN:mxlm-admin-2026}

# Actuator 健康检查（云托管用）
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.mxlm: DEBUG
